services:
  postgres:
    image: postgres:18.6-alpine
    container_name: n-tutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nts
      POSTGRES_PASSWORD: nts
      POSTGRES_DB: nts
    ports:
      - '5433:5432'
    volumes:
      - n-tutor-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nts -d nts']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  n-tutor-pgdata:
