<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation progress — sheet tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  Reference mock for Story 4.7 (Obvious Progress Spinner + sheet tally).
  Illustration only: where this mock and DESIGN.md / EXPERIENCE.md disagree, the spines win.
  Values are tokens.ts (Reading Room, 2026-10-11), Parent View density.
-->
<style>
  :root {
    --bg-default: #F4EFE4; --bg-paper: #FDFAF3;
    --text-primary: #1B2620; --text-secondary: #545F58; --divider: #7E857C;
    --accent: #2C4F7C; --success: #0F6E78; --action-hover: rgba(27,38,32,0.04);
    --radius-control: 8px; --pad: 20px; --gap: 16px;
    --dur: 200ms; --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg-default: #101713; --bg-paper: #17201B;
    --text-primary: #E6EDE8; --text-secondary: #A4B2AA; --divider: #6C766F;
    --accent: #8FB3E0; --success: #71C3CE; --action-hover: rgba(230,237,232,0.06);
  } }
  :root[data-theme="dark"] {
    --bg-default: #101713; --bg-paper: #17201B;
    --text-primary: #E6EDE8; --text-secondary: #A4B2AA; --divider: #6C766F;
    --accent: #8FB3E0; --success: #71C3CE; --action-hover: rgba(230,237,232,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; font-family: 'Source Sans 3', system-ui, sans-serif;
         background: var(--bg-default); color: var(--text-primary); line-height: 1.45; }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
  .mock-label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
                color: var(--text-secondary); margin: 0 0 8px; }
  .card { background: var(--bg-paper); border-radius: 2px; padding: var(--pad);
          box-shadow: 0 0 0 1px color-mix(in srgb, var(--divider) 35%, transparent); }
  .panel { display: grid; gap: var(--gap); padding: var(--pad); background: var(--action-hover);
           border-radius: var(--radius-control); }
  h2 { margin: 0; font-size: 20px; font-weight: 600; }
  p { margin: 0; }
  .secondary { color: var(--text-secondary); }

  /* ---- Sheet tally ---- */
  .tally { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; }
  .sheet { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
  .sheet svg.doc { width: 44px; height: 44px; fill: none; stroke-width: 1.5;
                   stroke-linecap: round; stroke-linejoin: round; }
  .sheet.waiting svg.doc { stroke: var(--divider); }
  .sheet.waiting svg.doc .body { stroke-dasharray: 3 3; }
  .sheet.ready svg.doc { stroke: var(--success); }
  .sheet.ready svg.doc .body { fill: color-mix(in srgb, var(--success) 12%, transparent); }
  .sheet.ready svg.doc .mark { stroke-width: 2.25; stroke-dasharray: 12; stroke-dashoffset: 0;
                               animation: draw var(--dur) var(--ease) both; }
  .sheet.ready { animation: land var(--dur) var(--ease) both; }
  .sheet.making svg.doc { stroke: var(--accent); }
  .sheet.making::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                         border: 3px solid color-mix(in srgb, var(--accent) 18%, transparent);
                         border-top-color: var(--accent); animation: spin 900ms linear infinite; }
  .sheet.missed svg.doc { stroke: var(--text-secondary); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes land { from { transform: scale(.85); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: 12; } }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet .mark { animation: none !important; }
    .sheet.making::after { animation: none; border-color: var(--accent); border-style: dotted; }
  }

  .status-line { font-size: 18px; font-weight: 600; }
  .count { font-size: 28px; font-weight: 700; line-height: 1; }
  .count small { font-size: 16px; font-weight: 400; color: var(--text-secondary); margin-left: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 18px; height: 18px; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .btn { justify-self: start; min-height: 44px; padding: 0 16px; border-radius: var(--radius-control);
         border: 1px solid var(--accent); color: var(--accent); background: transparent;
         font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle { justify-self: end; }
</style>
</head>
<body>
<main>
  <button class="btn toggle" type="button" onclick="(function(r){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'})(document.documentElement)">Toggle light / dark</button>
</main>

<template id="doc">
  <svg class="doc" viewBox="0 0 24 24" aria-hidden="true">
    <path class="body" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
    <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
  </svg>
</template>

<script>
  // Lucide geometry (file, file-check-2, file-x-2, file-text) inline so the mock is self-contained.
  const marks = {
    waiting: '<path d="M8 13h6"/><path d="M8 17h4"/>',
    making:  '<path d="M8 13h6"/><path d="M8 17h4"/>',
    ready:   '<path class="mark" d="m9 15 2 2 4-4"/>',
    missed:  '<path class="mark" d="m14.5 12.5-5 5"/><path class="mark" d="m9.5 12.5 5 5"/>',
  };
  function sheet(state) {
    const li = document.createElement('li');
    li.className = 'sheet ' + state;
    li.innerHTML = document.getElementById('doc').innerHTML.replace('</svg>', marks[state] + '</svg>');
    return li;
  }
  const scenarios = [
    { label: 'Started — 0 of 5', heading: 'Making the practice tests', produced: 0, requested: 5, running: true },
    { label: 'Running — 1 of 5', heading: 'Making the practice tests', produced: 1, requested: 5, running: true },
    { label: 'Running — 3 of 5', heading: 'Making the practice tests', produced: 3, requested: 5, running: true },
    { label: 'Done — 5 of 5', heading: 'Practice tests from this upload', produced: 5, requested: 5, done: true },
    { label: 'Partially complete — 3 of 5', heading: 'Practice tests from this upload', produced: 3, requested: 5, partial: true },
  ];
  const main = document.querySelector('main');
  for (const s of scenarios) {
    const wrap = document.createElement('section');
    wrap.innerHTML = `<p class="mock-label">${s.label}</p>`;
    const card = document.createElement('div'); card.className = 'card';
    const panel = document.createElement('section'); panel.className = 'panel';
    panel.innerHTML = `<h2>${s.heading}</h2>`;
    const count = document.createElement('p'); count.className = 'count'; count.setAttribute('aria-hidden', 'true');
    count.innerHTML = `${s.produced} of ${s.requested}<small>ready</small>`;
    const ul = document.createElement('ul'); ul.className = 'tally'; ul.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < s.requested; i++) {
      let state = 'waiting';
      if (i < s.produced) state = 'ready';
      else if (s.running && i === s.produced) state = 'making';
      else if (s.partial) state = 'missed';
      ul.appendChild(sheet(state));
    }
    const status = document.createElement('p'); status.setAttribute('role', 'status');
    status.textContent = s.done ? `All ${s.requested} practice tests are ready.`
      : s.partial ? `${s.produced} of ${s.requested} practice tests were made. Trying again for the rest is free.`
      : `${s.produced} of ${s.requested} practice tests are ready.`;
    status.className = 'status-line';
    panel.append(ul, status);
    if (s.running) {
      const stay = document.createElement('p'); stay.className = 'secondary';
      stay.textContent = 'Stay on this screen to see them arrive. Leaving loses nothing — they will be in Pending drafts.';
      panel.append(stay);
    }
    if (s.done || s.partial) {
      const b = document.createElement('a'); b.className = 'btn'; b.href = '#'; b.textContent = 'Review the drafts →';
      panel.append(b);
    }
    card.append(panel); wrap.append(card); main.append(wrap);
  }
  // Legend once, under the first card.
  const legend = document.createElement('div'); legend.className = 'legend';
  const ico = (stroke, inner) => `<svg viewBox="0 0 24 24" style="stroke:${stroke}" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>${inner}</svg>`;
  legend.innerHTML =
    `<span>${ico('var(--divider)', marks.waiting)} Waiting</span>` +
    `<span>${ico('var(--accent)', marks.making)} Being made</span>` +
    `<span>${ico('var(--success)', marks.ready)} Ready</span>` +
    `<span>${ico('var(--text-secondary)', marks.missed)} Not made</span>`;
  main.append(legend);
</script>
</body>
</html>
